<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>REVALO24 — Find your place in Europe</title>
    <meta name="description" content="The multilingual property marketplace for the European Economic Area." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/logo-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/logo-mark.svg" />
    <!-- Fonts: self-hosted via @fontsource-variable (see main.tsx) — avoids
         render-blocking Google Fonts on LCP. -->
    <!-- Hero LCP: discover same-origin WebP before JS (BASE_URL = / or /REVALO24/). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%BASE_URL%hero/hero-1280.webp"
      imagesrcset="%BASE_URL%hero/hero-640.webp 640w, %BASE_URL%hero/hero-960.webp 960w, %BASE_URL%hero/hero-1280.webp 1280w, %BASE_URL%hero/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      /* Clear retired font-pair lab preference if present */
      try { localStorage.removeItem("r24.fontPair"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
