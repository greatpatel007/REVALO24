<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>REVALO24 — Find your place in Europe</title>
    <meta name="description" content="The multilingual property marketplace for the European Economic Area." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='9' fill='%230F172A'/%3E%3Cpath d='M20 9l9 6.5v9L20 31l-9-6.5v-9L20 9z' stroke='%232563EB' stroke-width='2.2' fill='none'/%3E%3Ccircle cx='20' cy='20' r='3.4' fill='%2310B981'/%3E%3C/svg%3E" />
    <!-- Fonts: self-hosted via @fontsource-variable (see main.tsx) — avoids
         render-blocking Google Fonts on LCP. -->
    <!-- Hero LCP: discover same-origin WebP before JS (BASE_URL = / or /REVALO24/). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%BASE_URL%hero/hero-1280.webp"
      imagesrcset="%BASE_URL%hero/hero-640.webp 640w, %BASE_URL%hero/hero-960.webp 960w, %BASE_URL%hero/hero-1280.webp 1280w, %BASE_URL%hero/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      /* Clear retired font-pair lab preference if present */
      try { localStorage.removeItem("r24.fontPair"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
